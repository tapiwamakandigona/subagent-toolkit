name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck scripts
        run: shellcheck templates/loop.sh templates/check_budget.sh tests/loop_selftest.sh tests/harness_budget.sh

      - name: validate features.json template
        run: python3 -c "import json; json.load(open('templates/features.json'))"

      - name: loop.sh self-test
        run: sh tests/loop_selftest.sh

      - name: harness budget (HARNESS.md size, README claim, check_budget can fail)
        run: sh tests/harness_budget.sh
