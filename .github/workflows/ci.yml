name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint and behavioral regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck templates
        run: shellcheck templates/loop.sh templates/verify.sh

      - name: Validate feature-template JSON syntax
        run: python3 -c "import json; json.load(open('templates/features.json'))"

      - name: Offline harness behavior and integrity tests
        run: python3 -m unittest discover -s tests -v
