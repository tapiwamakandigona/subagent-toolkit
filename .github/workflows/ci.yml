name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck loop template
        run: shellcheck templates/loop.sh

      - name: validate features.json template
        run: python3 -c "import json; json.load(open('templates/features.json'))"
